name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Capacitor y preparar proyecto
        run: |
          mkdir www
          # Mueve los archivos web a la carpeta que Capacitor compila
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec mv {} www/ \;
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MiApp" "com.ejemplo.miapp" --web-dir "www"
          npx cap add android

      - name: Compilar APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
